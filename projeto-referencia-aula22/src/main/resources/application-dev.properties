# Banco H2 em memória (desenvolvimento)
# MODE=MySQL: o H2 aceita a sintaxe do MySQL
# (assim os mesmos scripts do Flyway valem em dev e prod)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# O Flyway cria as tabelas; o Hibernate apenas
# confere se o mapeamento bate com o banco
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Chave de assinatura dos tokens (só para desenvolvimento: 32 caracteres ou mais)
app.jwt.secret=chave-de-desenvolvimento-com-mais-de-32-caracteres

# Console web do H2 (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
