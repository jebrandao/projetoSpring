# Banco MySQL (produção).
# Os valores podem ser sobrescritos por variáveis de ambiente.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/db_api}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:alunolab}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate

# Banco que já existia (criado pelo Hibernate antes do Flyway):
# o estado atual é tratado como a versão 1
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=true
spring.h2.console.enabled=false
